[package]
categories = ["os"]
keywords = ["process-management", "process-supervision", "resource-limits", "linux", "rust"]
readme = "README.md"
name = "crowsi-process-adapter"
version = "0.11.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "Physical process ownership through exact processkit; no domain policy or identity"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]
repository = "https://github.com/crowsi-net/crowsi-process-adapter"

[workspace]

[dependencies]
getrandom = "=0.4.3"
processkit = { version = "=3.3.4", default-features = false, features = ["process-control", "limits"] }
tokio = { version = "1.49", features = ["process", "time", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.49", features = ["macros", "rt", "io-util", "time", "process"] }

[lints.rust]
unsafe_code = "forbid"

